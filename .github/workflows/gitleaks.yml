name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

# Without this block the job inherits the repo's default GITHUB_TOKEN scopes.
# Those are set to contents-only here, so on a pull_request event the action's
# first call — GET /pulls/{n}/commits, to work out which commits to scan — 403s
# and the job dies before scanning anything. It looked like a secret was found;
# nothing had been checked at all. Push events were unaffected, which is why
# only PRs went red.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so leaks in old commits are caught too
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
