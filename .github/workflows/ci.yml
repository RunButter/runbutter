name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # The published plugin is a contract with other people's clients: a
      # frontmatter name that stops matching its directory makes a conforming
      # client SKIP the skill silently, which is exactly the kind of break
      # nobody notices until someone opens an issue. --strict, so our own
      # plugin is held to the quality rules too, not just the specification.
      - name: Agent Plugin conformance
        run: npm run check:plugin

      # Seconds, and it catches in the fast job what the compose job needs six
      # minutes and a full image build to discover.
      - name: The migrate image has what it imports
        run: npm run check:docker

      # The Privy id must be WELL-FORMED — the provider validates its shape
      # offline and throws on anything else, which fails the prerender of every
      # page. This one is fake and 25 characters, the shape Privy issues.
      # Nothing is contacted at build time.
      #
      # No STRIPE_SECRET_KEY on purpose: building without billing configured is
      # what a self-hoster who sells nothing does, so CI should be the one to
      # notice if that ever breaks again.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: clbuildonlyfakeappid00000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

  schema:
    name: Schema applies, and the bundle matches
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Every migration, from empty, in order — the thing a new self-hoster does
      # on their first day and the thing nobody tests by hand twice.
      - name: Apply all migrations to an empty database
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Re-running changes nothing
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # SECURITY DEFINER bypasses RLS and the anon key ships in the browser
      # bundle, so an anon-callable DEFINER function is reachable straight
      # against PostgREST — around /api/rpc, the only thing that verifies a
      # Privy token. 0046 revoked those grants; every migration after it added
      # them back one at a time until 69 functions were exposed. This is the
      # gate that stops the third time.
      - name: No SECURITY DEFINER function is reachable by anon
        run: npm run check:grants
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # The pricing page and the enforcement must agree. Two copies of a
      # number a human maintains is how the plan matrix in CLAUDE.md ended up a
      # whole business model behind reality; this makes disagreement unmergeable.
      - name: Plan limits match lib/plans.ts
        run: npm run check:plans
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # supabase/schema.sql is generated. A stale one is an install path that
      # quietly ships yesterday's schema, which is worse than not having it.
      - name: supabase/schema.sql is up to date
        run: |
          npm run bundle:sql
          if ! git diff --quiet -- supabase/schema.sql; then
            echo "::error::supabase/schema.sql is stale — run 'npm run bundle:sql' and commit it."
            git diff --stat -- supabase/schema.sql
            exit 1
          fi

  # ── Does `docker compose up` actually work? ────────────────────────────────
  # The self-host path was written, documented and never once booted. That is
  # the single highest-leverage thing to check on a public repository: it is the
  # first command a stranger runs, and a broken first run costs the star and the
  # contributor.
  #
  # This boots the real stack — Postgres, the migrations, PostgREST, storage,
  # the gateway and the app — and asks the app for a page. It is slow (the app
  # image is a full Next build) which is why it runs alongside the other jobs
  # rather than in front of them.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Generated, never committed: JWT_SECRET plus an anon and service key
      # signed with it. PostgREST and storage-api both verify against that
      # secret, so a hand-written placeholder would fail the handshake and look
      # like a networking problem.
      - name: Compose an .env
        run: |
          cp .env.docker.example .env
          node scripts/gen-keys.mjs --write .env
          # Well-formed but fake — Privy validates the SHAPE offline and throws
          # on anything else, which would fail the app's prerender. Nothing is
          # contacted.
          echo 'PRIVY_APP_ID=clbuildonlyfakeappid00000' >> .env

      - name: docker compose up
        run: docker compose up -d --wait --wait-timeout 900

      # --wait already gates on the healthchecks, so reaching here means
      # Postgres came up, the migrations completed, and the gateway proved
      # PostgREST answers. What is left is whether the app itself serves.
      - name: The app serves
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = "200" ] && { echo "landing page: $code"; break; }
            sleep 5
          done
          test "$code" = "200" || { echo "::error::the app never served a 200"; exit 1; }

      # The check that would have caught the bug this job was written to find:
      # every server-side call used the BROWSER's Supabase URL, which inside the
      # container resolves to the app itself. /api/rpc reaching Postgres proves
      # the server talks to the gateway and not to its own port 8000.
      #
      # WHAT PASSING LOOKS LIKE. With no Privy token the proxy degrades and
      # still performs the call, so a healthy stack answers {"data":null,
      # "error":null} — an unknown user simply has no workspace. That is a
      # SUCCESSFUL round trip, so asserting on the word "error" would have been
      # exactly backwards.
      #
      # A server that cannot reach the database fails inside supabase-js and
      # surfaces as a transport error, so those strings are the real signal.
      - name: The server can reach Postgres
        run: |
          body=$(curl -s -X POST http://localhost:3000/api/rpc \
            -H 'content-type: application/json' \
            -d '{"fn":"get_my_workspace","args":{"p_privy":"did:privy:ci-smoke-test"}}')
          echo "$body"
          if echo "$body" | grep -qiE 'fetch failed|ECONNREFUSED|ENOTFOUND|socket hang up|EAI_AGAIN'; then
            echo "::error::/api/rpc could not reach Postgres — the server-side Supabase URL is wrong"
            exit 1
          fi
          echo "$body" | grep -q '"data"' || {
            echo "::error::/api/rpc did not return a JSON envelope"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 120

      - name: Tear down
        if: always()
        run: docker compose down -v
