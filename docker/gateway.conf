# The gateway that makes a plain Postgres look like a Supabase project.
#
# `supabase-js` is hardcoded to talk to ONE origin and to path-prefix everything
# it does: /rest/v1/ for PostgREST, /storage/v1/ for the storage API, /auth/v1/
# for GoTrue. Real Supabase puts Kong in front to do that routing. This is the
# same job in twenty lines, because routing three prefixes does not need an API
# gateway.
#
# It is also why RunButter can self-host at all without vendoring the whole
# Supabase stack: the app never needs GoTrue, since authentication is Privy.

server {
    listen 8000;
    server_name _;

    # Uploads. The app caps files at 50 MB, so anything larger is already a
    # rejected request — refusing it here saves streaming it first.
    client_max_body_size 50M;

    # PostgREST. It serves at the root, so the prefix is stripped.
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        # PostgREST reads the role from the JWT; the anon key is a JWT signed
        # with the same secret, which is what makes the roles line up.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Profile $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;
        proxy_set_header Prefer $http_prefer;
    }

    # Storage. Keeps its prefix — storage-api expects to be mounted at /.
    location /storage/v1/ {
        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        # A signed-URL redirect points back through this gateway, so the
        # forwarded host has to be the one the browser asked for.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything else is a mistake worth naming. A 404 with an empty body here
    # reads as "the container is broken" rather than "that path is not served".
    location / {
        default_type application/json;
        return 404 '{"error":"Not served here. This gateway routes /rest/v1/ and /storage/v1/ only — RunButter uses Privy for auth, not GoTrue."}';
    }
}
